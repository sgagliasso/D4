<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <img src="./assets-20261009T121844Z-1-001/assets/logo.png" alt="Amazon Logo">
    </header>
    <nav class="navbar">
        <ul class="menu">
            <li><a href="#">All</a></li>
            <li><a href="#">Today's deals</a></li>
            <li><a href="#">Customers Service</a></li>
            <li><a href="#">Registry</a></li>
            <li><a href="#">Gift Cards</a></li>
            <li><a href="#">Sell</a></li>
        </ul>
    </nav>
    <main>
        <div class="container">
            <section class="gift-cards">
                <div Class="banner">
                    <p>Shop All Holiday Gift Cards</p>
                </div>
                <div class="gift-card-images">
                    <h1>Holiday Gift Guides</h1>
                    <h3>Be a go-gifter</h3>
                </div>
            </section>
            <section class="find-the-perfect-gift">
                <div Class="container-title">
                    <p class="title">Find the Perfect Gift</p>
                    <p class="shop-now"><a href="">Shop now</a></p>
                </div>
                <div class= 'photo-container'>
                <img  src="./assets-20261009T121844Z-1-001/assets/img_1.jpg" alt="Kindle">
                <img src="./assets-20261009T121844Z-1-001/assets/img_2.jpg" alt="PC">
                <img src="./assets-20261009T121844Z-1-001/assets/img_3.jpg" alt="Smartwatch">
                <img src="./assets-20261009T121844Z-1-001/assets/img_4.jpg" alt="Pets">
                </div>
            </section>
            <section >
                <figure class="image-with-caption">
                    <img src="./assets-20261009T121844Z-1-001/assets/img_9.png" alt="VR">
                    <figcaption>Play the gifting game <span class="caption-shop"><a href="">Shop gaming</a></span></figcaption>
                </figure>
                <figure class="image-with-caption">
                    <img src="./assets-20261009T121844Z-1-001/assets/img_10.png" alt="VR">
                    <figcaption>The sound of cheer <span class="caption-shop"><a href="">Shop Audio & Accessories</a></span></figcaption>
                </figure>
            </section>
            <section class="shop-extra">

            </section>
        </div>
    </main>
    <footer>
        <div class="back-to-top">
            <a href="#top">Back to top</a>
        </div>
        <div class="footer-logo">
            <img src="./assets-20261009T121844Z-1-001/assets/logo.png" alt="logo Amazon">
        </div>
    </footer>
</body>

</html>
